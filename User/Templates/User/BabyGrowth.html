<!DOCTYPE html>
<html>
<head>

<title>Baby Growth</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-4">

<h2>Baby Growth</h2>

<p>
Mother:
<strong>
{{ profile.registration.user_name }}
</strong>
</p>

<hr>

<table class="table table-bordered table-striped">

<thead class="table-warning">

<tr>
<th>Week</th>
<th>Weight</th>
<th>Growth Status</th>
<th>Date</th>
</tr>

</thead>

<tbody>

{% for growth in growth_records %}

<tr>

<td>
{{ growth.pregnancy_week }}
</td>

<td>
{{ growth.weight }}
</td>

<td>
{{ growth.growth_status }}
</td>

<td>
{{ growth.created_at }}
</td>

</tr>

{% empty %}

<tr>

<td colspan="6" class="text-center">
No baby growth records available.
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
