{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f6ff, #ffffff);
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border: 2px solid #222;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .error {
            color: red;
            background: #ffeaea;
            border: 1px solid red;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #777;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 2px solid #55aee8;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #66b7e8;
            border: 2px solid #222;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #45a5df;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <img src="{% static 'Images/Admin.png' %}"
             alt="Pregnancy & Baby Tracker">
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Pregnancy & Baby Tracker
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Email</label>

        <input type="email"
               name="txt_email"
               placeholder="Enter admin email"
               required>

        <label>Password</label>

        <input type="password"
               name="txt_password"
               placeholder="Enter admin password"
               required>

        <button type="submit"
                name="btn_login"
                class="login-btn">
            Admin Login
        </button>

    </form>

    <div class="back">
        <a href="{% url 'Guest:HomePage' %}">
            ← Back to Home
        </a>
    </div>
</div>
</body>
</html>
