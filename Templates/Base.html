<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
            Pregnancy & Baby Tracker
            {% endblock %}
        </title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                background: #f5f6fa;
                color: #333;
            }

            .navbar {
                background: #6c63ff;
                color: white;
                padding: 18px 30px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .navbar h2 {
                margin: 0;
            }

            .navbar a {
                color: white;
                text-decoration: none;
                margin-left: 20px;
            }

            .container {
                width: 90%;
                max-width: 1200px;
                margin: 30px auto;
            }

            .card {
                background: white;
                padding: 25px;
                border-radius: 12px;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
                margin-bottom: 20px;
            }

            h1, h2, h3 {
                margin-bottom: 15px;
            }

            button {
                background: #6c63ff;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
            }

            button:hover {
                background: #574fd6;
            }

            .message {
                background: #d4edda;
                color: #155724;
                padding: 12px;
                border-radius: 6px;
                margin-bottom: 20px;
            }

            footer {
                text-align: center;
                padding: 20px;
                margin-top: 40px;
                background: #6c63ff;
                color: white;
            }
        </style>

        {% block extra_css %}
        {% endblock %}
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar">
            <h2>Pregnancy & Baby Tracker</h2>
            <div>
                <a href="/">Home</a>
            </div>
        </nav>
        <!-- Main Content -->
        <div class="container">
            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>
        <!-- Footer -->
        <footer>
            <p>© 2026 Pregnancy & Baby Tracker</p>
        </footer>
        {% block extra_js %}
        {% endblock %}
    </body>
</html>
